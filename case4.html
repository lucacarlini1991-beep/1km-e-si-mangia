<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caso 4 — Accesso</title><style>body{margin:0;background:#0b0c0e;color:#eee8dc;font:16px Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(560px,calc(100% - 28px));background:#151719;border:1px solid #383b3d;border-radius:16px;padding:26px}.small{color:#aaa49a;font-size:13px}input{width:100%;box-sizing:border-box;background:#0c0d0f;color:#fff;border:1px solid #4b4e52;border-radius:8px;padding:13px;margin:7px 0 12px;font-size:16px}.btn{width:100%;background:#191b1d;color:#eee8dc;border:1px solid #c7a85d;border-radius:8px;padding:12px;margin-top:8px;font-size:15px}.err{color:#e39a9a}.note{margin-top:14px;padding:11px;background:#111315;border:1px solid #51472f;border-radius:8px}</style></head><body><main class="box"><div>🎩 DOSSIER INVESTIGATIVO</div><h1>CASO 4</h1><p class="small">La Casa delle Maree</p><p>Inserite il nome del commissario/detective. La password di accesso è <b>caso</b>.</p><label>Nome utente</label><input id="user" placeholder="Qualsiasi nome"><label>Password</label><input id="pw" type="password" placeholder="caso"><button class="btn" onclick="enter()">ACCEDI AL CASO</button><button class="btn" onclick="fresh()">NUOVA PARTITA — RICOMINCIA DA ZERO</button><div id="msg"></div><div class="note small">Il nome inserito diventerà il nome del Commissario nel fascicolo. Il caso è completo e giocabile.</div></main><script>const K='CASO4_STATE';function enter(){const u=user.value.trim();if(!u)return msg.innerHTML='<p class="err">Inserite un nome utente.</p>';if(pw.value.trim().toLowerCase()!=='caso')return msg.innerHTML='<p class="err">Password non corretta.</p>';localStorage.setItem('COMMISSARIO_CASO4',u);location.href='caso4-gioco.html'}function fresh(){localStorage.removeItem(K);msg.innerHTML='<p>✓ Partita azzerata. Ora accedete al caso.</p>'}</script></body></html>
