name: Repair casodemo UI
on:
  push:
    paths:
      - 'casodemo-ui-repair-trigger.txt'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add robust demo UI fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('casodemo.html')
          s=p.read_text()
          marker='<script id="casodemo-ui-fallback">'
          if marker in s:
              raise SystemExit('fallback already installed')
          js=r'''<script id="casodemo-ui-fallback">
          (()=>{
            const KEY='QC_DEMO_V9';
            const IMG={letter:'/assets/case-demo/scene-delitto.jpg',receipt:'/assets/case-demo/repertazione-forense.jpg',photo:'/assets/case-demo/impronta-scarpa.jpg',key:'/assets/case-demo/confronto-impronte.jpg'};
            const E={letter:['Foto scena del delitto','FOTOGRAFIA DELLA SCENA',IMG.letter,'La scena è stata fotografata dopo la rimozione della salma. Osservate accessi, mobili e oggetti fuori posto.'],receipt:['Ricevuta del Blackbird','PROVA DOCUMENTALE',IMG.receipt,'Controllate orario, consumazioni e dettagli del cliente.'],key:['Chiave d’ottone','REPERTO',IMG.key,'Reperto fisico: la chiave è utilizzabile solo quando è realmente nel vostro inventario.'],photo:['Fotografia del cortile','PROVA FOTOGRAFICA',IMG.photo,'Sul retro compare una nota che indica il lato nord e invita a non usare la porta principale.'],log:['Registro d’accesso','DOCUMENTO',IMG.letter,'Gli orari devono essere confrontati con le dichiarazioni dei sospetti.'],voice:['Trascrizione telefonata','AUDIO / TRASCRIZIONE',IMG.letter,'Dichiarazione acquisita durante l’indagine. Può essere riletta senza consumare domande.']};
            function state(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x||typeof x!=='object')throw 0;x.places=x.places||{};x.inventory=Array.isArray(x.inventory)?x.inventory:[];x.evidence=x.evidence||{};x.suspects=x.suspects||{};return x}catch(e){return {scene:'start',inventory:[],evidence:{letter:true},places:{studio:{known:true,available:true}},suspects:{}}}}
            let S=state();
            const $=id=>document.getElementById(id);
            function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
            function modal(title,html){if(!$('modal')||!$('modalbody'))return; $('modalbody').innerHTML='<h2>'+title+'</h2>'+html;$('modal').classList.add('open')}
            function close(){if($('modal'))$('modal').classList.remove('open')}
            function inspect(k){let e=E[k];if(!e)return;modal(e[0],'<div class="small">'+e[1]+'</div><img class="photo" src="'+e[2]+'"><div class="doc"><b>OSSERVAZIONE INVESTIGATIVA</b><p>'+e[3]+'</p></div>')}
            function render(){
              if($('inventory')) $('inventory').innerHTML=S.inventory.length?S.inventory.map(k=>{let e=E[k];return e?'<div class="item" data-fallback-i="'+k+'" style="cursor:pointer"><b>'+e[0]+'</b><br><span class="small">CON VOI · CLICCA PER ESAMINARE</span></div>':''}).join(''):'<div class="small">Inventario vuoto. Gli oggetti raccolti compariranno qui.</div>';
              if($('places')){let names={studio:'Studio di Arthur Wren',blackbird:'Blackbird',station:'Stazione di King’s Cross',mercer:'Deposito Mercer'};let out='';Object.keys(names).forEach(k=>{let p=S.places[k];out+=p&&p.known?'<div class="place"><span class="badge">DISPONIBILE</span> '+names[k]+'</div>':'<div class="place"><span class="badge">SCONOSCIUTO</span> Luogo sconosciuto</div>'});$('places').innerHTML=out}
              if($('evidence')){let keys=Object.keys(E).filter(k=>S.evidence[k]);$('evidence').innerHTML=keys.length?keys.map(k=>{let e=E[k];return '<div class="card"><img src="'+e[2]+'"><b>'+e[0]+'</b><br><button class="btn" data-fallback-e="'+k+'">ESAMINA</button></div>'}).join(''):'<div class="small">Nessuna prova acquisita.</div>'}
              if($('suspects')){let out='';if(S.suspects.lydia||S.evidence.voice)out+='<div class="card"><b>👤 Lydia Shaw</b><br><span class="small">Collegata alla consegna della chiave.</span></div>';if(S.suspects.carter||S.evidence.log)out+='<div class="card"><b>👤 E. Carter</b><br><span class="small">Nome presente nel registro.</span></div>';$('suspects').innerHTML=out||'<div class="small">Nessun sospetto identificato.</div>'}
              if($('commands')&&!$('commands').children.length){$('commands').innerHTML=['📍 DOVE SONO?','🔎 COSA POSSO FARE QUI?','🧭 VIAGGIAMO VERSO...','👤 INTERROGA','🎒 INVENTARIO','📂 PROVE','❓ AIUTO','🏁 HO FATTO TUTTO QUI'].map(x=>'<button class="btn" style="font-size:12px" data-fallback-c="'+x+'">'+x+'</button>').join('')}
              if($('state'))$('state').innerHTML='Scena: '+(S.scene||'start')+' · Prove: '+Object.keys(E).filter(k=>S.evidence[k]).length+' · Oggetti: '+S.inventory.length;
              save();
            }
            document.addEventListener('click',e=>{let i=e.target.closest('[data-fallback-i]');if(i){inspect(i.dataset.fallbackI);return}let v=e.target.closest('[data-fallback-e]');if(v){inspect(v.dataset.fallbackE);return}if(e.target.id==='close'){close();return}let c=e.target.closest('[data-fallback-c]');if(c){let t=c.dataset.fallbackC; if(t.includes('INVENTARIO')) modal('Inventario','<p>'+(S.inventory.length?S.inventory.map(k=>E[k]?.[0]).join('<br>'):'Vuoto')+'</p>'); else if(t.includes('PROVE')) modal('Prove acquisite','<p>'+Object.keys(E).filter(k=>S.evidence[k]).map(k=>E[k][0]).join('<br>')+'</p>'); else if(t.includes('DOVE')) modal('Posizione','<p>Siete a <b>'+((S.scene==='studio')?'Studio di Arthur Wren':(S.scene||'Punto di partenza'))+'</b>.</p>'); else modal('Master','<p>Usate i comandi contestuali o scrivete un’azione. Le prove acquisite possono essere esaminate direttamente.</p>')}});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
          })();
          </script>'''
          s=s.replace('</body>',js+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add casodemo.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make casodemo playable on mobile'
          git push
