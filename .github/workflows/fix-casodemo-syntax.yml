name: Fix casodemo syntax
on:
  push:
    paths:
      - 'casodemo-syntax-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inline handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('casodemo.html')
          s=p.read_text()
          bad='onclick=\\"ev(\\\'\\\'+k+\\\'\\\')\\"'
          # The generated HTML contains a fragile inline handler. Replace it with a data attribute.
          s=s.replace('onclick=\\"ev(\\\'\\\'+k+\\\'\\\')\\"', 'data-open-e=\\"\\\'+k+\\\'\\"')
          marker="document.getElementById('inventory').onclick=e=>{let x=e.target.closest('[data-i]');if(x)inspectItem(x.dataset.i)};"
          add="document.getElementById('inventory').onclick=e=>{let x=e.target.closest('[data-i]');if(x)inspectItem(x.dataset.i)};document.getElementById('modalbody').onclick=e=>{let x=e.target.closest('[data-open-e]');if(x)ev(x.dataset.openE)};"
          s=s.replace(marker,add,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add casodemo.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix casodemo script syntax'
          git push
