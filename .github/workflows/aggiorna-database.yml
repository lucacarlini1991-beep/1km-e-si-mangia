name: Aggiorna database OSM

on:
  schedule:
    # GitHub usa UTC: uno dei due orari corrisponde alle 03:00 in Italia,
    # a seconda dell'ora solare/legale. Lo script scarta l'altro.
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forza subito un aggiornamento"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aggiorna-database-osm
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '1' || '0' }}

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controlla orario italiano
        id: time
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          echo "Ora Italia: ${HOUR}:$(TZ=Europe/Rome date +%M)"
          if [ "$HOUR" = "03" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggiorna database da OpenStreetMap
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: node aggiorna-database-osm.js

      - name: Salva aggiornamento nel repository
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uscite.json database-update-state.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "chore: aggiorna database OSM"
            git push
          fi
