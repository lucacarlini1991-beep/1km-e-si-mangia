name: Ticketag Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  check-ticketag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Ticketag
        env:
          TICKETAG_URL: https://sampdoria-ticketag.ticketone.it/Partita/25dcc650-296c-4652-874e-58f9e4f947c3?tickets=1
        run: node bots/ticketag-bot.mjs

      - name: Publish status
        run: |
          git config user.name "ticketag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot-status.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento nello stato."
            exit 0
          fi
          git commit -m "Aggiorna stato bot Ticketag"
          git pull --rebase origin main
          git push origin HEAD:main
