name: Ticketag Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub permette al massimo un avvio programmato ogni 5 minuti.
    # Partenza sfalsata per ridurre i ritardi dei picchi allo scoccare dell'ora.
    - cron: '2-57/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ticketag-bot
  cancel-in-progress: false

jobs:
  check-ticketag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Monitoraggio Ticketag rapido
        env:
          TICKETAG_URL: https://sampdoria-ticketag.ticketone.it/Partita/25dcc650-296c-4652-874e-58f9e4f947c3?tickets=1
        run: |
          set -e
          git config user.name "ticketag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub può avviare il job solo ogni 5 minuti; durante ogni job
          # teniamo il browser attivo e controlliamo frequentemente.
          for i in $(seq 1 20); do
            echo "===== Controllo $i/20: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
            node bots/ticketag-bot.mjs

            # Pubblichiamo subito un cambio di disponibilità, ma evitiamo
            # 20 commit consecutivi quando lo stato resta invariato.
            CURRENT_AVAILABLE=$(node -e "const s=require('./bot-status.json'); process.stdout.write(String(s.available))")
            PREVIOUS_AVAILABLE=$(git show HEAD:bot-status.json 2>/dev/null | node -e "let d=''; process.stdin.on('data',x=>d+=x).on('end',()=>{try{process.stdout.write(String(JSON.parse(d).available))}catch{process.stdout.write('unknown')}})" || true)

            if [ "$CURRENT_AVAILABLE" != "$PREVIOUS_AVAILABLE" ]; then
              git add bot-status.json
              git commit -m "Aggiorna disponibilità Ticketag"
              git pull --rebase origin main
              git push origin HEAD:main
            else
              echo "Disponibilità invariata ($CURRENT_AVAILABLE): nessun commit."
            fi

            if [ "$i" -lt 20 ]; then
              echo "Attendo 15 secondi..."
              sleep 15
            fi
          done
