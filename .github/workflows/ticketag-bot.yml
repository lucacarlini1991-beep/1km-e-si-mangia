name: Ticketag Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub permette un avvio programmato non più frequente di 5 minuti.
    # Offset di 3 minuti per ridurre i ritardi dei picchi allo scoccare dell'ora.
    - cron: '3-58/5 * * * *'

permissions:
  contents: write

concurrency:
  group: ticketag-bot
  cancel-in-progress: false

jobs:
  check-ticketag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Controllo Ticketag continuo
        env:
          TICKETAG_URL: https://sampdoria-ticketag.ticketone.it/Partita/25dcc650-296c-4652-874e-58f9e4f947c3?tickets=1
        run: |
          set -e
          git config user.name "ticketag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "===== Controllo $i/5: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
            node bots/ticketag-bot.mjs

            git add bot-status.json
            if git diff --cached --quiet; then
              echo "Stato invariato."
            else
              git commit -m "Aggiorna stato bot Ticketag"
              git pull --rebase origin main
              git push origin HEAD:main
            fi

            if [ "$i" -lt 5 ]; then
              echo "Attendo 60 secondi per il prossimo controllo..."
              sleep 60
            fi
          done
