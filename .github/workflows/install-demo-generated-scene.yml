name: Install demo generated crime scene photo

on:
  push:
    paths:
      - 'assets/case-demo/scene-delitto.jpg.b64'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode generated scene photo
        run: |
          base64 -d assets/case-demo/scene-delitto.jpg.b64 > assets/case-demo/scene-delitto.jpg
          rm assets/case-demo/scene-delitto.jpg.b64
      - name: Commit photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/case-demo/scene-delitto.jpg assets/case-demo/scene-delitto.jpg.b64
          git diff --cached --quiet || git commit -m 'Add generated crime scene photo to demo'
          git push
