name: Add real forensic photos to case demo
on:
  push:
    branches: [main]
    paths:
      - 'demo-real-photos-trigger.txt'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real forensic photographs
        run: |
          mkdir -p assets/case-demo
          curl -L 'https://upload.wikimedia.org/wikipedia/commons/6/6c/Scena_Del_Crimine_con_gli_oggetti_sopra_la_tavola.jpg' -o assets/case-demo/scene-repertata.jpg
          curl -L 'https://upload.wikimedia.org/wikipedia/commons/d/d0/Forensic_Scene_Investigator_photographing_evidence.jpg' -o assets/case-demo/repertazione-forense.jpg
          curl -L 'https://upload.wikimedia.org/wikipedia/commons/b/b2/Crime_scene_shoeprint.jpg' -o assets/case-demo/impronta-scarpa.jpg
          curl -L 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Fingerprint_Comparison.jpg' -o assets/case-demo/confronto-impronte.jpg
      - name: Replace demo placeholders with local real photos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('casodemo.html')
          s=p.read_text()
          replacements={
            'https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=900&q=80':'/assets/case-demo/scene-repertata.jpg',
            'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80':'/assets/case-demo/repertazione-forense.jpg',
            'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=900&q=80':'/assets/case-demo/impronta-scarpa.jpg',
            'https://images.unsplash.com/photo-1516914943479-89db7d9ae7f2?auto=format&fit=crop&w=900&q=80':'/assets/case-demo/confronto-impronte.jpg'
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          s=s.replace('Questa demo usa fotografie reali di repertazione e analisi forense. Le immagini sono vere fotografie, non immagini generate e non fotografie del caso narrativo.','Questa demo usa fotografie reali di repertazione e analisi forense. Le immagini sono vere fotografie, non immagini generate e non fotografie del caso narrativo.')
          p.write_text(s)
          PY
      - name: Add source credits
        run: |
          cat > assets/case-demo/README.md <<'EOF'
          Real photographs used in casodemo.html.
          Sources: Wikimedia Commons.
          - Scena Del Crimine con gli oggetti sopra la tavola — Federico Candoni — CC BY-SA 4.0
          - Forensic Scene Investigator photographing evidence — West Midlands Police — CC BY-SA 2.0
          - Crime scene shoeprint — Zalman992 — Public Domain
          - Fingerprint Comparison — E. Daley — CC BY-SA 4.0
          EOF
      - name: Commit photos and demo update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add casodemo.html assets/case-demo
          git diff --cached --quiet && exit 0
          git commit -m 'Add real forensic photographs to case demo'
          git push
