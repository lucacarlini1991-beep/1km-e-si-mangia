name: Aggiorna database Esplora Uscite

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aggiorna parcheggi
        run: node scripts/build-parcheggi-overpass.js
      - name: Aggiorna camper
        run: node scripts/build-camper-overpass.js
      - name: Aggiorna luoghi
        run: node scripts/build-luoghi-overpass.js
      - name: Salva modifiche
        run: |
          git config user.name "1KM Data Bot"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Aggiorna database Esplora Uscite"
          git push
