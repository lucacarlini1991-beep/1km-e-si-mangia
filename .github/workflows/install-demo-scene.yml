name: Install demo crime scene photo
on:
  push:
    paths:
      - demo-scene-trigger.txt
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and install crime scene photo
        run: |
          mkdir -p assets/case-demo
          python - <<'PY'
          import urllib.parse, urllib.request
          prompt = "photorealistic forensic crime scene photograph after the body has been removed, warm dim living room and study, overturned wooden chair, coffee table with wine bottle and glass, open patio doors at night, rug, scattered papers, a small subtle trace near the floor, yellow numbered evidence markers 1 2 3 4, police forensic documentation style, natural flash photography, no people, no visible corpse, no graphic gore, realistic proportions, documentary evidence photo"
          url = "https://image.pollinations.ai/prompt/" + urllib.parse.quote(prompt) + "?width=1200&height=900&model=flux&nologo=true&safe=true&seed=184032"
          urllib.request.urlretrieve(url, "assets/case-demo/scene-delitto.jpg")
          PY
          python - <<'PY'
          import re
          p='casodemo.html'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r"letter:'[^']*'", "letter:'/assets/case-demo/scene-delitto.jpg'", s, count=1)
          s=s.replace("['Lettera senza firma','DOCUMENTO'", "['Foto scena del delitto','FOTOGRAFIA DELLA SCENA'")
          open(p,'w',encoding='utf-8').write(s)
          PY
          file assets/case-demo/scene-delitto.jpg
      - name: Commit changes
        run: |
          rm -f demo-scene-trigger.txt .github/workflows/install-demo-scene.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casodemo.html assets/case-demo/scene-delitto.jpg demo-scene-trigger.txt .github/workflows/install-demo-scene.yml
          git commit -m "Add generated crime scene photo to case demo"
          git push
