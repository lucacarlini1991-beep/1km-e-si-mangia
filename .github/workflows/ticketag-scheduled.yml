name: Ticketag Scheduled Watch

on:
  push:
    branches:
      - main
    paths-ignore:
      - bot-status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticketag-bot
  cancel-in-progress: true

jobs:
  check-ticketag:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Controllo Ticketag continuo
        env:
          TICKETAG_URL: https://sampdoria-ticketag.ticketone.it/Partita/25dcc650-296c-4652-874e-58f9e4f947c3?tickets=1
        run: |
          set -e
          git config user.name "ticketag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Una singola esecuzione resta attiva quasi 6 ore.
          # Il riavvio finale la fa ripartire senza dipendere dal cron.
          for i in $(seq 1 290); do
            echo "===== Controllo $i/290: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
            node bots/ticketag-bot.mjs

            if git diff --quiet -- bot-status.json; then
              echo "Nessuna modifica da pubblicare."
            else
              # Prima creiamo il commit locale, poi riallineiamo main e infine pushiamo.
              # In questo modo evitiamo il pull --rebase con modifiche già staged.
              git add bot-status.json
              git commit -m "Aggiorna stato bot Ticketag"
              git pull --rebase origin main
              git push origin HEAD:main
            fi

            if [ "$i" -lt 290 ]; then
              echo "Attendo 60 secondi prima del prossimo controllo..."
              sleep 60
            fi
          done

          # Riavvio autonomo: il push di questo file avvia una nuova esecuzione.
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/ticketag-heartbeat
          git add .github/ticketag-heartbeat
          git commit -m "Riavvia monitor Ticketag"
          git push origin HEAD:main
