name: Ticketag Scheduled Watch

on:
  push:
    branches:
      - main
  schedule:
    # Un controllo ogni 5 minuti, spostato fuori dal minuto 0 per ridurre i ritardi.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticketag-bot
  cancel-in-progress: false

jobs:
  check-ticketag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Controllo Ticketag
        env:
          TICKETAG_URL: https://sampdoria-ticketag.ticketone.it/Partita/25dcc650-296c-4652-874e-58f9e4f947c3?tickets=1
        run: |
          set -e
          git config user.name "ticketag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== Controllo: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ====="
          node bots/ticketag-bot.mjs

          git add bot-status.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Aggiorna stato bot Ticketag"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
