<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caso 1 — Il Quarto Cassetto</title><style>body{margin:0;background:#0b0c0e;color:#eee8dc;font:16px Arial,sans-serif}#login{min-height:100vh;display:grid;place-items:center}.box{width:min(520px,calc(100% - 28px));background:#151719;border:1px solid #383b3d;border-radius:16px;padding:26px;box-sizing:border-box}.small{color:#aaa49a;font-size:13px}input{width:100%;box-sizing:border-box;background:#0c0d0f;color:#fff;border:1px solid #4b4e52;border-radius:8px;padding:13px;margin:7px 0 12px;font-size:16px}.btn{background:#191b1d;color:#eee8dc;border:1px solid #c7a85d;border-radius:8px;padding:11px 14px;font-size:15px;cursor:pointer}.wide{width:100%;margin-top:8px}.err{color:#e39a9a}#game{display:none;height:100vh}header{height:54px;box-sizing:border-box;padding:10px 14px;background:#151719;border-bottom:1px solid #383b3d;display:flex;justify-content:space-between;align-items:center;gap:8px}.frame{width:100%;height:calc(100vh - 54px);border:0;display:block}.actions{display:flex;gap:8px}</style></head><body><section id="login"><main class="box"><div>🎩 DOSSIER INVESTIGATIVO</div><h1>CASO 1</h1><p class="small">Il Quarto Cassetto</p><p>Nome utente: qualsiasi nome. Password: <b>caso</b>.</p><label>Nome del commissario/detective</label><input id="user" autocomplete="name" placeholder="Qualsiasi nome"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="caso"><button class="btn wide" onclick="enter()">ACCEDI AL CASO</button><button class="btn wide" onclick="newGame()">↻ NUOVA PARTITA — RICOMINCIA DA ZERO</button><div id="msg"></div><p class="small">Il nome inserito diventa il nome del Commissario nel fascicolo.</p></main></section><section id="game"><header><b>🎩 CASO 1 · IL QUARTO CASSETTO</b><span id="who"></span><button class="btn" onclick="newGame()">↻ NUOVA PARTITA</button></header><iframe class="frame" src="caso.html" title="Il Quarto Cassetto"></iframe></section><script>const KEY='IL_QUARTO_CASSETTO_V1';const U='COMMISSARIO_CASO1';function enter(){const u=document.getElementById('user').value.trim(),p=document.getElementById('pw').value.trim().toLowerCase();if(!u)return msg.innerHTML='<p class="err">Inserite un nome utente.</p>';if(p!=='caso')return msg.innerHTML='<p class="err">Password non corretta.</p>';localStorage.setItem(U,u);show(u)}function show(u){document.getElementById('login').style.display='none';document.getElementById('game').style.display='block';document.getElementById('who').textContent='COMMISSARIO: '+u}function newGame(){localStorage.removeItem(KEY);const u=document.getElementById('user').value.trim();if(u)localStorage.setItem(U,u);if(document.getElementById('game').style.display==='block')location.reload();else document.getElementById('msg').innerHTML='<p>✓ Partita azzerata. Ora accedete al caso.</p>'}window.addEventListener('load',()=>{const u=localStorage.getItem(U);if(u)show(u)})</script></body></html>
